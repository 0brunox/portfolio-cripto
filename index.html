<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portfólio Cripto</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #111;
      color: #f1f1f1;
    }

    #chart {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      height: 500px;
    }

    form {
      margin-top: 30px;
    }

    input, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    input {
      background-color: #333;
      color: white;
    }

    button {
      background-color: #00c853;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #00e676;
    }

    #tokenList div {
      margin-top: 10px;
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 5px;
      display: inline-block;
    }

    h1, h2, p {
      color: #f1f1f1;
    }
  </style>
</head>
<body>
  <h1>Portfólio Cripto</h1>
  <div id="chart"></div>
  <p id="totalValue">Valor total: R$ 0,00</p>

  <form id="addTokenForm">
    <input type="text" id="tokenId" placeholder="ID do token (ex: bitcoin)" required>
    <input type="text" id="tokenSymbol" placeholder="Símbolo (ex: BTC)" required>
    <input type="number" id="tokenQty" placeholder="Quantidade" step="any" required>
    <button type="submit">Adicionar Token</button>
  </form>

  <h2>Tokens adicionados</h2>
  <div id="tokenList"></div>

  <script src="script.js"></script>
</body>
</html>
