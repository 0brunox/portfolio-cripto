<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Portfólio Cripto</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    canvas { max-width: 600px; margin: 20px auto; display: block; }
    form { margin-top: 20px; }
    input, button { padding: 8px; margin: 5px; }
  </style>
</head>
<body>
  <h1>Portfólio Cripto</h1>
  <canvas id="portfolioChart"></canvas>
  <p id="totalValue">Valor total: R$ 0,00</p>

  <form id="addTokenForm">
    <input type="text" id="tokenId" placeholder="ID do token (ex: bitcoin)" required>
    <input type="text" id="tokenSymbol" placeholder="Símbolo (ex: BTC)" required>
    <input type="number" id="tokenQty" placeholder="Quantidade" step="any" required>
    <button type="submit">Adicionar Token</button>
  </form>
<h2>Tokens adicionados</h2>
<div id="tokenList"></div>
  <script src="script.js"></script>
</body>
</html>
